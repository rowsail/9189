# OpenOCD config for the Spectracom board's Triscend TA7S20-33QC (ARM7TDMI)
# via the J-Link V8 clone.
#
# Wiring notes (established 2026-10-27):
#  - Leave J-Link pin 1 (VTref) DISCONNECTED as a precaution: on these clones it may be
#    driven rather than a sense input (unconfirmed). OpenOCD does not need VTref here.
#  - Board header pin 6 must be grounded: it is the output-enable for the
#    LVC125 buffers between the Triscend JTAG pins and the header.
#  - nRESET/nTRST are not used (reset_config none).
#
# Usage:  openocd -f openocd/triscend_a7s.cfg
# then:   telnet localhost 4444      (halt / arm reg / mdw / resume ...)
#   or:   arm-none-eabi-gdb -ex "target extended-remote :3333"

adapter driver jlink
transport select jtag
adapter speed 1000
reset_config none

jtag newtap a7 cpu -irlen 4 -ircapture 0x1 -irmask 0xf -expected-id 0x1843d2ff
target create a7.cpu arm7tdmi -endian little -chain-position a7.cpu

# Triscend A7S fixed address map (see datasheet TCH305-0001-002):
#   0xD101_0000  control registers (64K)
#   0xD103_0000  internal SRAM (16K)
#   0xD104_0000  configuration memory (256K)
